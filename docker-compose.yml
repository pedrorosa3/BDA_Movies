version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      # Credenciais lidas do ficheiro .env (ver .env.example)
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?Definir MONGO_USER no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:?Definir MONGO_PASS no .env}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:


